<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Suika Game - Merge Fruits!</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #373835 0%, #727370 25%, #63635e 50%, #5e5f5a 75%, #313231 100%);
            animation: gradientShift 15s ease infinite;
            background-size: 400% 400%;
            font-family: 'Arial', sans-serif;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        #game-container {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            max-width: 100vw;
            max-height: 100vh;
            background: #6e826b;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        #music-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #ff9a9e;
            border-radius: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.1s ease;
            z-index: 10000;
            user-select: none;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        #music-toggle:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.3);
        }

        #music-toggle:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.2);
        }

        #music-toggle.playing {
            background: rgba(255, 182, 193, 0.95);
            animation: pixelPulse 1s steps(2, end) infinite;
        }

        @keyframes pixelPulse {
            0%, 100% {
                box-shadow: 4px 4px 0 rgba(255, 154, 158, 0.4);
            }
            50% {
                box-shadow: 4px 4px 0 rgba(255, 154, 158, 1);
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.js"></script>
</head>
<body>
    <!-- Background Music -->
    <audio id="bg-music" loop>
        <!-- Local music file -->
        <source src="assets/audio/screamvillain.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Toggle Button -->
    <div id="music-toggle" title="Toggle Music">OFF</div>

    <div id="game-container"></div>
    <script src="src/config/constants.js"></script>
    <script src="src/objects/Fruit.js"></script>
    <script src="src/objects/PowerUpManager.js"></script>
    <script src="src/scenes/GameScene.js"></script>
    <script src="src/main.js"></script>

    <script>
        // Background music controller
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        let isMusicPlaying = false;

        // Set initial volume
        bgMusic.volume = 0.3;

        // Music toggle functionality
        musicToggle.addEventListener('click', function() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicToggle.textContent = 'OFF';
                musicToggle.classList.remove('playing');
                isMusicPlaying = false;
            } else {
                // Try to play music (browsers require user interaction to play audio)
                const playPromise = bgMusic.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        musicToggle.textContent = 'ON';
                        musicToggle.classList.add('playing');
                        isMusicPlaying = true;
                    }).catch(error => {
                        console.log('Music play prevented:', error);
                        musicToggle.textContent = 'OFF';
                    });
                }
            }
        });

        // Auto-play attempt (will work if user has interacted with the page)
        window.addEventListener('load', function() {
            // Wait a moment then try to start music
            setTimeout(() => {
                const playPromise = bgMusic.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        musicToggle.textContent = 'ON';
                        musicToggle.classList.add('playing');
                        isMusicPlaying = true;
                    }).catch(() => {
                        // Auto-play prevented, user needs to click the button
                        musicToggle.textContent = 'OFF';
                    });
                }
            }, 500);
        });
    </script>
</body>
</html>
